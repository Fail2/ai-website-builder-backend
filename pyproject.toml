[project]
name = "ai-website-builder-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.163.2",
    "greenlet>=3.5.6",
    "langchain>=1.5.0",
    "langchain-firecrawl>=0.1.0",
    "langchain-google-genai>=4.0.0",
    "langchain-groq>=1.2.1",
    "langchain-openai>=1.8.1",
    "langchain-openrouter>=0.3.0",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.22",
    "langgraph-checkpoint-postgres>=3.2.1",
    "pgvector>=0.5.1",
    "psycopg[binary,pool]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "sqlalchemy>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
